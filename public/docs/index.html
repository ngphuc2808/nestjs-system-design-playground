<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>⚡ NestJS System Design & High-Concurrency Architecture Portal</title>
  <meta http-equiv="X-UA-Encoding" content="IE=edge,chrome=1" />
  <meta name="description" content="NestJS Modular Monolith System Design, Database Benchmarking, High Concurrency, & Distributed Messaging Documentation Portal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Clean Vue Light Theme stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #4f46e5;
    }
    .markdown-section pre>code {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
    }
    .markdown-section blockquote {
      border-left: 4px solid #4f46e5;
      background: rgba(79, 70, 229, 0.05);
      color: #334155;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">⚡ Loading System Design Architecture Portal...</div>
  <script>
    window.$docsify = {
      name: '⚡ NestJS System Design',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Tìm kiếm tài liệu kiến trúc...',
        noData: '❌ Không tìm thấy kết quả!',
        depth: 6
      },
      copyCode: {
        buttonText: '📋 Copy',
        errorText: 'Lỗi',
        successText: 'Đã copy'
      }
    }
  </script>

  <!-- Docsify Core CDN -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Full-Text Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Button Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- PrismJS Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

</body>
</html>
